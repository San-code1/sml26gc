[package]
name = "gb_port"
version = "0.1.0"
edition = "2021"
default-run = "gb_port"

[dependencies]
macroquad = "0.4"
cpal = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
