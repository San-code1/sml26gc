[workspace]
resolver = "2"
members = [
    "crates/gb-core",
    "crates/cart-model",
    "crates/host",
    "crates/i18n",
    "crates/fonts",
    "crates/app-resources",
    "crates/project-model",
    "game",
    "editor",
    "tools/research",
    "regression",
    "xtask",
]
[workspace.package]
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["The SML2 6GC authors"]

[workspace.dependencies]
gb-core = { path = "crates/gb-core" }
cart-model = { path = "crates/cart-model" }
host = { path = "crates/host" }
i18n = { path = "crates/i18n" }
fonts = { path = "crates/fonts" }
app-resources = { path = "crates/app-resources" }
project-model = { path = "crates/project-model" }
macroquad = "0.4"
cpal = "0.15"
png = "0.17"
gilrs = "0.11"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs", "Win32_Globalization", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_Security"] }

# The emulator is too slow to play unoptimised, so even debug builds are optimised.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

# The executables that are shipped (`cargo xtask package`): smaller, no debug symbols.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
